; Marine Water Ingress Sensor
; nRF52840 via Raytac MDBT50Q-1MV2 / Adafruit nRF52 Arduino core

[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino

; Shared library path
lib_extra_dirs = ../shared-lib

; Build flags
build_flags =
    -DWATER_SENSOR
    -DDEBUG_SERIAL

; Serial monitor speed
monitor_speed = 115200

; Upload via SWD (J-Link) — comment out if using USB bootloader
; upload_protocol = jlink
